[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-learn"
version = "0.1.0"
description = "Agentic study system for OpenAI's math manuscript collection"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "math-learn user" }]
license = { text = "MIT" }

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2", "numpy>=1.26"]
dev = ["pytest>=8"]

[project.scripts]
mathlearn = "mathlearn.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
